name: Manager app build

on:
  push:
    branches: [main]
    paths:
      - "manager/**"
      - "kernel/include/su_uapi.h"
      - ".github/workflows/manager-build.yml"
  pull_request:
    paths:
      - "manager/**"
      - "kernel/include/su_uapi.h"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # FIX: the action's default is "tools platform-tools". Google
          # removed the legacy 'tools' (standalone SDK Tools) package
          # from the SDK repository; recent GitHub-hosted runner images
          # ship an sdkmanager that can no longer resolve it at all, so
          # the default fails the whole step with "Failed to find
          # package 'tools'" before any Gradle step even runs - this
          # isn't a problem with this project's own code. 'tools' had
          # nothing this build needs anyway: everything it provided is
          # superseded by the command line tools this action already
          # puts on PATH regardless of `packages` (sdkmanager itself,
          # d8/r8, etc.) - see android-actions/setup-android's own notes.
          packages: "platform-tools"

      - name: Install NDK + CMake
        run: sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # No gradlew is committed (deliberately - see manager/README note);
      # this job provides Gradle itself via gradle/actions/setup-gradle.
      - name: Assemble debug APK
        working-directory: manager
        run: gradle :app:assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: su-manager-debug
          path: manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
