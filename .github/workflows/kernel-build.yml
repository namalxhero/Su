# Kernel module build check (Phase 6).
#
# Compiles kernel/ as an out-of-tree module (`make M=...`) against two
# REAL kernel trees, to actually catch compile errors instead of just
# the brace/paren sanity checks this project has relied on so far (no
# kernel source tree has been available in the environment these files
# were written in - see every kernel/*.c file's own "not compiled
# against a real build" caveat).
#
# IMPORTANT: this builds against plain upstream kernel.org (vanilla
# mainline) tags, NOT any Android/device-specific kernel fork. Building
# the actual flashable kernel for a specific phone (device defconfig,
# vendor patches, this module integrated into that tree) is the END
# USER's own job, same as it's always been - see kernel/Kbuild's and
# ../README.md's "Integration" notes.
#
# DEEP-KERNEL REWORK: this matrix originally existed specifically to
# exercise both branches of a do_execveat_common() argument-layout
# detection (SU_EXECVE_HAS_FD_ARG) that su_hook.c no longer has - it
# hooks the kernel's own sched_process_exec tracepoint now, whose
# signature doesn't vary across these kernel versions, so there is
# nothing version-specific left to detect. The two-tree matrix (old vs.
# new kernel) stays anyway: it's still a real, useful compile check
# against genuinely different kernel API surfaces (the GCC-version and
# header-split issues documented below were found THIS way, independent
# of the now-removed fd-arg logic), and confirms
# register_trace_sched_process_exec()/<trace/events/sched.h> actually
# resolves on both a 2014-era tree and a modern one - not assumed.
# CONFIG_SU_CORE=m is now passed explicitly on the build command line
# (see that step) since kernel/Kbuild uses obj-$(CONFIG_SU_CORE), and
# neither target tree's own .config knows about this project's Kconfig
# symbol - see kernel/Kconfig's own header comment for why that's
# expected, not a bug.
#
# FIRST REAL RUN RESULTS (reproduced locally, not just in CI, before this
# fix): both matrix legs failed, for two unrelated reasons that this
# version of the workflow fixes:
#
#   - vanilla-v3.18: fails to configure at all with Ubuntu's current
#     apt gcc-aarch64-linux-gnu (GCC 13) - "fatal error:
#     linux/compiler-gcc13.h: No such file or directory". v3.18's
#     compiler-gcc.h dispatch only ships gcc3/4/5 compat headers; this
#     is a genuine, well-known old-kernel-vs-modern-GCC incompatibility,
#     not a bug in kernel/ itself. Fixed by using an older prebuilt
#     cross-toolchain (Linaro 7.5.0) for this leg only, instead of
#     fighting GCC13 compatibility in a 2014 kernel tree.
#   - vanilla-v6.6: two issues surfaced in actual compilation:
#     su_allowlist.c used a macro that doesn't exist (`DEFINE_WAIT_QUEUE_HEAD`
#     - the real one is `DECLARE_WAIT_QUEUE_HEAD`) and was missing
#     `<linux/sched.h>`; su_hide.c used fget()/fput() without
#     `<linux/file.h>`. Both are now fixed in kernel/*.c directly.
#
# Both legs also hit the same build-infra issue once the code itself
# compiled: modpost errors on every kernel-internal symbol (printk,
# kfree, ...) as "undefined", because this workflow only runs
# `modules_prepare` (fast - prepares headers/scripts) rather than a full
# `make modules` of the whole tree (slow - would also populate
# Module.symvers with every vmlinux-exported symbol's version info).
# Those symbols are real and do exist in vmlinux at actual build/link
# time on a real kernel build; modpost here just doesn't have their
# versions recorded without a full build it can't afford to do for a
# "does this still compile" check. KBUILD_MODPOST_WARN=1 downgrades
# that from a hard error to a warning, which is the right tradeoff for
# this workflow's own stated goal (compiles cleanly on both trees) - it
# is NOT appropriate for an actual flashable-kernel build, which goes
# through a full tree build and has no such gap.
#
# SECOND REAL RUN RESULT (after the two fixes above got both legs
# actually compiling and linking): both legs still failed, this time
# at the later "Confirm sched_process_exec tracepoint hook built in"
# verification step - su_core.ko compiled and linked cleanly but
# carried no reference to tracepoint_probe_register or
# __tracepoint_sched_process_exec at all. Root cause: CONFIG_TRACEPOINTS
# is a prompt-less `bool` (kernel/trace/Kconfig / init/Kconfig) - it is
# only ever turned on by something else `select`-ing it (CONFIG_TRACING,
# itself selected by the "Tracers" menu options under CONFIG_FTRACE),
# and generic arm64 `defconfig` selects none of those - unlike a real
# Android/device defconfig, which always carries ftrace/systrace
# support (see su_hook.c's own file-header comment on that assumption).
# With CONFIG_TRACEPOINTS off, <trace/events/sched.h>'s DECLARE_TRACE
# machinery silently expands register_trace_sched_process_exec() to a
# no-op stub instead of a real call - the module still compiles and
# links fine either way, it just hooks nothing, which is exactly why
# this surfaced at the nm-based verification step and not as a build
# error. Fixed by forcing CONFIG_FTRACE + CONFIG_FUNCTION_TRACER on
# directly in .config (pulling TRACEPOINTS in through its real select
# chain, rather than trying to force a prompt-less symbol directly,
# which oldconfig would just recalculate back off) - see the
# "Force-enable CONFIG_TRACEPOINTS" step below for the rest.

name: Kernel module build check

on:
  push:
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel-build.yml'
  pull_request:
    paths:
      - 'kernel/**'
      - '.github/workflows/kernel-build.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vanilla-v3.18
            # Stable 3.18.y rather than the original v3.18 tag: the original tag's
            # include/linux/compiler-gcc.h includes linux/compiler-gcc<GCC major>.h,
            # which does not exist for GCC 7 ("fatal error: linux/compiler-gcc7.h"),
            # whatever toolchain is used. 3.18.y has the unified compiler-gcc.h.
            kernel_repo: gregkh/linux
            kernel_ref: v3.18
            # Generic in-tree arm64 defconfig that ships with vanilla
            # upstream - not any device's own defconfig.
            defconfig: defconfig
            # v3.18 (2014) does not compile with the apt-provided GCC
            # 13 cross-compiler on current runners - see this file's
            # header comment. Use a period-appropriate prebuilt
            # instead; this leg alone needs it.
            toolchain: linaro-4.9
          - name: vanilla-v6.6
            kernel_repo: torvalds/linux
            kernel_ref: v6.6
            defconfig: defconfig
            toolchain: apt

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout target kernel tree (${{ matrix.name }})
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.kernel_repo }}
          ref: ${{ matrix.kernel_ref }}
          path: target-kernel
          fetch-depth: 1

      - name: Install kernel build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev make

      - name: Install cross toolchain (apt, GCC 13)
        if: matrix.toolchain == 'apt'
        run: |
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          echo "CROSS_COMPILE_BIN=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      # Pre-GCC6-era trees (v3.18 here) need an actually old compiler -
      # see this file's header comment on compiler-gcc.h.
      #
      # GCC 4.9 is what actually compiles v3.18 - confirmed by building
      # su_core.ko against real v3.18 sources end-to-end with this exact
      # toolchain before this workflow was written this way. "elf" (bare
      # metal), not "linux-gnu": kernel modules don't link against a
      # target libc, so the GNU/Linux-targeted toolchain isn't needed.
      - name: Install cross toolchain (Linaro GCC 4.9.4 - for pre-GCC6-era trees)
        if: matrix.toolchain == 'linaro-4.9'
        run: |
          set -euo pipefail
          TC_DIR="${RUNNER_TEMP}/linaro49"
          git clone --depth 1 -b linaro \
            https://github.com/GrowtopiaJaw/aarch64-linux-android-4.9.git "${TC_DIR}"
          "${TC_DIR}/bin/aarch64-elf-gcc" --version | head -1
          echo "${TC_DIR}/bin" >> "$GITHUB_PATH"
          echo "CROSS_COMPILE_BIN=aarch64-elf-" >> "$GITHUB_ENV"

      - name: Configure target kernel (${{ matrix.defconfig }})
        working-directory: target-kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE_BIN} O=../build HOSTCFLAGS="-fcommon" ${{ matrix.defconfig }}

      # Root cause of the "Confirm sched_process_exec tracepoint hook
      # built in" step's v3.18 failure (first real CI run of the
      # deep-kernel rework): CONFIG_TRACEPOINTS is a `bool` with NO
      # Kconfig prompt (kernel/trace/Kconfig / init/Kconfig) - it is
      # only ever turned on by something else `select`-ing it
      # (CONFIG_TRACING, itself selected by the various "Tracers" menu
      # options under CONFIG_FTRACE). Generic arm64 `defconfig` (a
      # minimal upstream vanilla config - NOT a real Android/device
      # defconfig, which always has ftrace/systrace support baked in,
      # per su_hook.c's own file-header comment on that assumption)
      # does not select any of those, so CONFIG_TRACEPOINTS silently
      # ends up OFF for this CI leg specifically. With it off,
      # <trace/events/sched.h>'s DECLARE_TRACE machinery expands
      # register_trace_sched_process_exec() to a no-op stub instead of
      # a real call into tracepoint_probe_register() - su_hook.c still
      # compiles and links cleanly either way (that's exactly why this
      # was caught by the later nm-based verification step, not by the
      # compiler), it just silently hooks nothing. This is a property
      # of the generic CI config, not of su_hook.c's own code - a real
      # device kernel build (the only kind this module is ever
      # actually loaded into) already has this on, same as it already
      # has FTRACE/systrace for other reasons.
      #
      # Fix: force CONFIG_FTRACE + CONFIG_FUNCTION_TRACER on (the
      # oldest, most universally-present way to pull TRACEPOINTS in
      # through its real select chain - present on every kernel
      # version in this project's matrix, arm64 has HAVE_FUNCTION_TRACER)
      # directly in the generated .config, then re-run `oldconfig` to
      # let Kconfig resolve the rest of the select graph consistently
      # (`yes ""` rather than the newer `olddefconfig` target, which
      # may not exist on a 2014-era tree - oldconfig has been present
      # in every version this project targets).
      - name: Force-enable CONFIG_TRACEPOINTS (su_hook.c's hook needs it; generic defconfig doesn't select it)
        working-directory: target-kernel
        run: |
          set -euo pipefail
          CONFIG_FILE=../build/.config
          for opt in FTRACE FUNCTION_TRACER TRACEPOINTS; do
            sed -i "/^# CONFIG_${opt} is not set\$/d; /^CONFIG_${opt}=/d" "$CONFIG_FILE"
            echo "CONFIG_${opt}=y" >> "$CONFIG_FILE"
          done
          # `set -o pipefail` (this step's own `set -euo pipefail` above)
          # makes the pipeline's exit status reflect EVERY command in
          # it, not just the last - but `yes` is SUPPOSED to get
          # SIGPIPE/exit non-zero here, the instant `make oldconfig`
          # stops reading (finishes) while `yes` is still writing;
          # that is just how this well-known `yes | make oldconfig`
          # idiom ends, not a real failure. (First real CI run of this
          # step hit exactly this: "yes: standard output: Broken pipe"
          # failed the step even though `make oldconfig` itself had
          # already finished successfully.) Scoped off here rather
          # than dropped for the whole script, so a genuine failure
          # from `make oldconfig` itself still fails this step - only
          # `yes`'s expected broken-pipe exit is what's ignored.
          set +o pipefail
          yes "" | make ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE_BIN} O=../build HOSTCFLAGS="-fcommon" oldconfig
          set -o pipefail
          grep -q '^CONFIG_TRACEPOINTS=y$' ../build/.config || {
            echo "::error::CONFIG_TRACEPOINTS still not set after forcing FTRACE/FUNCTION_TRACER - this tree's select chain differs from what this step assumes, needs a real look rather than silently proceeding to build a module whose hook won't fire."
            exit 1
          }

      # HOSTCFLAGS=-fcommon: this step builds several HOST-side tools
      # (scripts/dtc in particular) using the runner's own GCC, not the
      # cross toolchain above. GCC 10+ defaults to -fno-common, which
      # breaks old dtc sources that rely on old-style "tentative
      # definition" merging across translation units ("multiple
      # definition of `yylloc'"). A build-host compiler default
      # change, unrelated to the target toolchain - needed on both
      # matrix legs, found while verifying the v3.18 build locally.
      - name: modules_prepare (generates headers our module builds against)
        working-directory: target-kernel
        shell: bash
        run: |
          make ARCH=arm64 CROSS_COMPILE=${CROSS_COMPILE_BIN} O=../build HOSTCFLAGS="-fcommon" modules_prepare 2>&1 | tee "${RUNNER_TEMP}/prepare.log"

      # CONFIG_SU_CORE=m: kernel/Kbuild gates on obj-$(CONFIG_SU_CORE)
      # (see kernel/Kconfig) - passed directly on the command line since
      # neither target tree's own .config (vanilla upstream, no
      # knowledge of this project's Kconfig symbol) would otherwise
      # define it, which would make obj-$(CONFIG_SU_CORE) expand to
      # nothing and silently skip building su_core.o entirely.
      #
      # KBUILD_MODPOST_WARN=1: see this file's header comment - this
      # workflow never runs a full `make modules` of the whole target
      # tree (too slow to do twice per push), so Module.symvers never
      # gets populated with vmlinux-exported symbol versions, and
      # modpost would otherwise hard-fail on every kernel-internal
      # symbol our module calls (printk, kfree, ...) as "undefined",
      # even though they trivially exist at real build/link time.
      - name: Build su_core.ko out-of-tree
        run: |
          make -C target-kernel O=$PWD/build M=$PWD/kernel ARCH=arm64 \
            CROSS_COMPILE=${CROSS_COMPILE_BIN} KBUILD_MODPOST_WARN=1 \
            CONFIG_SU_CORE=m HOSTCFLAGS="-fcommon" modules 2>&1 | tee build.log

      - name: Report build errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "### ${{ matrix.name }}: build failed"
            echo '```'
            for f in "${RUNNER_TEMP}/prepare.log" build.log; do
              if [ -f "$f" ]; then
                echo "--- $f"
                grep -n -E "error|Error|undefined|multiple definition|fatal|\*\*\*" "$f" | head -40 | cut -c1-300 || true
              fi
            done
            echo '```'
          } > "${RUNNER_TEMP}/err.md" || true
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"${RUNNER_TEMP}/err.md" || true

      # NOTE: su_core.ko lands in kernel/ itself (the M= directory), NOT
      # under build/kernel/ - the O= output dir only applies to the
      # *target kernel tree's* own build artifacts (set during configure
      # and modules_prepare above); the external module build (M=$PWD/kernel,
      # no O= override) drops its .ko alongside the module's own sources.
      - name: Confirm su_core.ko was produced
        run: |
          find kernel -name 'su_core.ko' -print -quit | grep -q . \
            || { echo "::error::su_core.ko not found - build did not actually succeed"; exit 1; }

      - name: Confirm sched_process_exec tracepoint hook built in (not silently skipped)
        run: |
          # The old fd-arg-branch check this replaced verified Kbuild's
          # $(info ...) output; there's no equivalent info line to check
          # anymore (nothing left to detect - see this file's header
          # comment), so instead confirm a reference to the tracepoint
          # actually made it into the built module. register_trace_sched_process_exec()
          # itself is a static-inline wrapper (generated by the
          # DECLARE_TRACE macro) and gets inlined at su_hook.c's call
          # site rather than appearing as its own symbol - what should
          # show up in `nm`'s undefined-symbol list instead is what that
          # inline body actually calls through to: tracepoint_probe_register
          # and/or the exported __tracepoint_sched_process_exec symbol
          # it registers against. Checked for either, since which one is
          # visible can depend on inlining/optimisation choices this
          # hasn't been run against a real build to confirm.
          if ! nm kernel/su_core.ko 2>/dev/null | grep -qE "tracepoint_probe_register|__tracepoint_sched_process_exec"; then
            echo "::error::su_core.ko shows no reference to tracepoint_probe_register or __tracepoint_sched_process_exec - su_hook.c's tracepoint registration may not have been compiled in (or this check's symbol-name assumption needs revisiting - see this step's own comment)"
            exit 1
          fi

      - name: Report compiler warnings (non-fatal)
        if: always()
        run: |
          count=$(grep -c "warning:" build.log || true)
          echo "## ${{ matrix.name }}: $count compiler warning(s)" >> "$GITHUB_STEP_SUMMARY"
          grep "warning:" build.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload su_core.ko (for inspection only - not a flashable artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: su_core-${{ matrix.name }}
          path: |
            kernel/su_core.ko
            build.log
          if-no-files-found: warn
